<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18372c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Willow Valley">
<title>Willow Valley · Your living settlement</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="game-page">
<div id="app">
<header class="topbar">
  <div><div class="eyebrow"><span id="environment">DEVELOPMENT</span> · <span id="offlineStatus">LOCAL GAME</span></div><h1>Willow Valley</h1><div id="calendar" class="calendar"></div><div id="housingSummary" class="housing-summary" aria-live="polite"></div></div>
  <div class="header-actions"><a id="worldBuilderLink" class="world-builder-entry" href="./ui-kit/world-lab.html" hidden>3D World</a><button class="icon-button" id="menuBtn" aria-label="Game menu">☰</button></div>
</header>
<section class="stats" id="resourceBar" aria-label="Settlement resources"></section>
<main id="stage" class="stage">
  <canvas id="game3D" hidden aria-label="3D settlement landscape"></canvas>
  <div id="terrainLoad" class="terrain-load" role="status" aria-live="polite" hidden>
   <strong id="terrainLoadTitle">Preparing 3D terrain…</strong>
   <span id="terrainLoadDetail">Your saved settlement is safe.</span>
   <button id="retry3D" type="button" hidden>Retry with lighter graphics</button>
  </div>
  <svg id="map" aria-label="Interactive map. In 3D, use two fingers to roll a virtual trackball and pinch to zoom. One finger pans in Explore mode or edits in build tools." role="img"></svg>
  <div class="map-info" id="modeLabel">Explore · drag to pan · pinch to zoom</div>
  <div class="zoom" aria-label="Camera controls"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="reset3DCamera" aria-label="Reset 3D camera to settlement" title="Reset view" hidden>⟳</button><output id="cameraAngle" class="camera-angle" aria-label="Camera viewing angle" hidden></output></div>
  <div class="road-controls" id="roadControls" hidden><span id="roadInfo">Tap the map to trace your road.</span><div><button id="undoRoad">Undo</button><button id="cancelRoad">Cancel</button><button id="confirmRoad" class="primary">Build road</button></div></div>
  <div class="zone-controls" id="zoneControls" hidden>
   <div class="zone-settings">
    <div class="zone-land-use"><label for="zoneType">Land use<select id="zoneType" aria-label="Land use"><option value="residential">Residential</option><option value="commercial">Commercial</option><option value="farmland">Farmland</option><option value="preserve">Preserve</option><option value="erase">Erase</option></select></label></div>
    <label for="zoneRadius">Brush size <output id="zoneRadiusValue" for="zoneRadius">54</output><input id="zoneRadius" type="range" min="24" max="90" step="1" value="54" aria-label="Brush size"></label>
   </div><div class="zone-tool-picker" role="group" aria-label="Zoning tools">
    <button id="zoneMove" type="button" aria-label="Move map" aria-pressed="false"><span aria-hidden="true">☝</span> Move</button>
    <button id="zonePaint" type="button" aria-label="Paint zoning" aria-pressed="true"><span aria-hidden="true">✎</span> Paint</button>
    <button id="zoneEraser" type="button" aria-label="Erase zoning" aria-pressed="false"><span aria-hidden="true">⌫</span> Erase</button>
   </div><span id="zoneInfo">Paint a connected land area</span>
   <div class="zone-actions"><button id="zoneUndo">Undo</button><button id="zoneCancel">Cancel</button><button id="zoneCommit" class="primary">Commit changes</button></div>
  </div>
</main>
<div class="dispatch"><div class="dispatch-copy"><span class="eyebrow">THE VALLEY REPORT</span><p id="report"></p></div><button id="historyBtn" aria-label="Settlement history">↗</button></div>
<nav class="dock" id="gameDock" aria-label="Game actions"></nav>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Game panel" hidden>
  <div class="sheet-grip"></div><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="closeSheet" class="icon-button" aria-label="Close">×</button></div>
  <div id="sheetBody"></div>
</section>
<input type="file" id="importSave" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script type="module" src="./app.mjs"></script>
</body></html>
