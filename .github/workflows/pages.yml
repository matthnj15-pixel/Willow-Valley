name: Publish Willow Valley
on:
  workflow_run:
    workflows: ["Test Willow Valley"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: willow-valley-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview
      - name: Build isolated stable and preview sites
        run: |
          set -eu
          mkdir -p _site/dev
          # Each branch is assembled independently. New feature modules can
          # appear on preview before stable without modifying this workflow.
          for branch in stable preview; do
            if [ "$branch" = stable ]; then dest="_site"; else dest="_site/dev"; fi
            cp "$branch/index.html" "$branch/styles.css" "$dest/"
            for module in "$branch"/*.mjs; do
              [ -f "$module" ] || continue
              cp "$module" "$dest/"
            done
            # Publish authored UI component galleries beside their matching branch.
            # Each catalog imports the exact UI module and styles from its own
            # branch, so previews never bleed into stable.
            if [ -d "$branch/ui-kit" ]; then
              mkdir -p "$dest/ui-kit"
              cp "$branch/ui-kit/"*.html "$dest/ui-kit/"
              cp "$branch/ui-kit/"*.mjs "$dest/ui-kit/"
              cp "$branch/ui-kit/"*.css "$dest/ui-kit/"
            fi
            # Publish a branch-local 3D preview only when it exists.
            if [ -d "$branch/world-lab" ]; then
              mkdir -p "$dest/world-lab"
              cp "$branch/world-lab/"*.html "$dest/world-lab/"
              cp "$branch/world-lab/"*.mjs "$dest/world-lab/"
              cp "$branch/world-lab/"*.css "$dest/world-lab/"
            fi
            # Offline assets are per-environment, like the saved game itself.
            for asset in sw.js manifest.webmanifest icon.svg; do
              if [ -f "$branch/$asset" ]; then cp "$branch/$asset" "$dest/$asset"; fi
            done
            if [ -f "$dest/sw.js" ]; then
              version=$(git -C "$branch" rev-parse HEAD)
              sed -i "s/__BUILD_VERSION__/$version/g" "$dest/sw.js"
            fi
          done
          # Build a truly self-contained HTML file from each branch's game.
          # Build tooling lives on develop but uses stable's own source for stable.
          if [ -f preview/scripts/build-offline.mjs ]; then
            (cd preview && npm install --no-audit --no-fund --no-package-lock)
            # iOS requires a real PNG touch icon. Render PNGs separately
            # for each environment using its own SVG source of truth.
            if [ -f preview/scripts/build-icons.mjs ]; then
              for branch in stable preview; do
                if [ "$branch" = stable ]; then dest="_site"; else dest="_site/dev"; fi
                if [ -f "$branch/icon.svg" ]; then
                  node preview/scripts/build-icons.mjs "$branch" "$dest"
                  test -s "$dest/apple-touch-icon.png"
                  test -s "$dest/icon-192.png"
                  test -s "$dest/icon-512.png"
                fi
              done
            fi
            node preview/scripts/build-offline.mjs preview _site/dev/offline.html
            node preview/scripts/build-offline.mjs stable _site/offline.html
            (cd _site/dev && zip -9 -q willow-valley-offline.zip offline.html)
            (cd _site && zip -9 -q willow-valley-offline.zip offline.html)
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
