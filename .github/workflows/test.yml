name: Test Willow Valley
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and simulation
        run: |
          node --check app.mjs
          node --check simulation.mjs
          node --check road-editor.mjs
          node --check road-network.mjs
          node --check road-gesture.mjs
          node --check config.mjs
          node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise mobile portrait road interactions
        run: npm run test:e2e
