name: Test Willow Valley
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and simulation
        run: |
          node --check app.mjs
          node --check simulation.mjs
          node --check config.mjs
          node --test tests/*.test.mjs
